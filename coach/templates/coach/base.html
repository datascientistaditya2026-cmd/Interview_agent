<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Interview Coach</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; background: #f9fafb; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
    input, textarea, select { width: 100%; padding: .6rem; margin: .3rem 0 1rem; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; box-sizing: border-box; }
    button, .btn { background: #2563eb; color: #fff; border: 0; padding: .6rem 1.1rem; border-radius: 8px; cursor: pointer; text-decoration: none; font: inherit; display: inline-block; }
    .alt { background: #6b7280; }
    .good { color: #047857; } .mid { color: #b45309; } .bad { color: #b91c1c; } .err { color: #b91c1c; }
    #loading { display: none; margin-top: 1rem; color: #6b7280; }
  </style>
</head>
<body>
  <h1><a href="/" style="color:inherit;text-decoration:none">🎯 AI Interview Coach</a></h1>
  {% block content %}{% endblock %}
  <script>
    // show a "thinking" message while the AI model works (it takes a few seconds)
    document.querySelectorAll("form").forEach(function (f) {
      f.addEventListener("submit", function () {
        var box = document.getElementById("loading");
        if (box) box.style.display = "block";
      });
    });
  </script>
</body>
</html>
